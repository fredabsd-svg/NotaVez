<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recuperar senha — Nota Sem Stress</title><link rel="stylesheet" href="/css/app.css"></head><body><main id="conteudo">
<h1>Recuperar senha</h1><form id="recuperar-conta"><label class="campo">E-mail da conta<input name="email" type="email" autocomplete="username" required maxlength="254"></label><button class="btn btn-primario" type="submit">Enviar instruções</button></form>
<form id="redefinir-senha" hidden><label class="campo">Nova senha (8 a 256 caracteres)<input name="senha" type="password" autocomplete="new-password" required minlength="8" maxlength="256"></label><label class="campo">Repita a nova senha<input name="confirmacao" type="password" autocomplete="new-password" required minlength="8" maxlength="256"></label><button class="btn btn-primario" type="submit">Salvar nova senha</button></form>
<p id="resultado" role="status" aria-live="polite"></p><p>O link expira e só pode ser usado uma vez. Ao redefinir a senha, todas as sessões anteriores são revogadas.</p><p><a href="/">Entrar no aplicativo</a> · <a href="/excluir-conta.html">Excluir conta</a> · <a href="/privacidade.html">Privacidade</a></p>
</main><script type="module" src="/js/conta-publica.js"></script></body></html>
