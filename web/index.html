<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <button type="button" id="voltar" class="topo-voltar" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <h1 id="titulo" class="topo-titulo">Nota Sem Stress</h1>
    <span id="selo-ambiente" class="selo selo-teste" hidden>Testes</span>
  </header>
  <a id="empresa-ativa" class="empresa-ativa" href="#/empresas" hidden aria-label="Trocar de empresa">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a1 1 0 011-1h9a1 1 0 011 1v16M15 9h4a1 1 0 011 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/></svg>
    <span>Empresa</span><em>Trocar</em>

    <strong>DEMONSTRAÇÃO:</strong> a Receita é simulada. Nenhuma nota fiscal real é emitida.
  </div>
  <div id="faixa-offline" class="faixa-offline" role="status" hidden>
    Sem internet. Você pode preparar notas: elas ficam salvas como <strong>rascunho</strong> e <strong>ainda não foram emitidas</strong>.
  </div>
  <main id="conteudo" tabindex="-1"></main>
  <nav class="abas" id="abas" aria-label="Navegação principal" hidden>
    <a href="#/" data-aba="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg><span>Início</span></a>

  <script type="module" src="/js/app.js"></script>
